<title>ROBLEND Test Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one long checklist in Blender-editor greys, sticky progress header, sections as collapsible panels. Deliberately one dark look (Blender's own). */
:root {
  --bg: #1d1d1d;
  --panel: #2b2b2b;
  --panel-2: #333333;
  --line: #3d3d3d;
  --fg: #e6e6e6;
  --fg-dim: #9a9a9a;
  --accent: #4772b3;      /* Blender's selection blue */
  --select: #ffa033;      /* Blender's active orange */
  --ok: #5fb85f;
  --bad: #e2574c;
  --skip: #7d7d7d;
  --kbd: #464646;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 920px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: 0.2px; text-wrap: balance; }
.ver { font-family: var(--mono); font-size: 12px; color: var(--select); }
.lede { color: var(--fg-dim); margin: 4px 0 10px; max-width: 70ch; }
.bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.bar .ok { background: var(--ok); } .bar .bad { background: var(--bad); } .bar .skip { background: var(--skip); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--fg-dim); font-variant-numeric: tabular-nums; align-items: center; }
.stats b { color: var(--fg); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.filters { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.chip { font: inherit; font-size: 12px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.save-state { font-size: 12px; color: var(--fg-dim); }
section.group { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
section.group > button.head {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--fg);
  background: none; border: 0; padding: 10px 14px; cursor: pointer;
}
.head .tri { color: var(--fg-dim); font-size: 11px; width: 10px; }
.head h2 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0; }
.head .count { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.head .count .b { color: var(--bad); }
.items { border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.st-works { box-shadow: inset 3px 0 0 var(--ok); }
.item.st-broken { box-shadow: inset 3px 0 0 var(--bad); }
.item.st-skip { box-shadow: inset 3px 0 0 var(--skip); }
.txt { min-width: 0; }
.name { font-weight: 600; }
.how, .expect { color: var(--fg-dim); margin-top: 2px; }
.expect::before { content: "Should: "; color: var(--select); font-weight: 500; }
kbd { font-family: var(--mono); font-size: 11.5px; background: var(--kbd); color: var(--fg); border-radius: 3px; padding: 0 5px; border-bottom: 2px solid #2a2a2a; white-space: nowrap; }
.btns { display: flex; gap: 4px; align-items: flex-start; }
.btns button { font: inherit; font-size: 12px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; }
.btns button:hover { border-color: #5a5a5a; }
.btns button:focus-visible, .chip:focus-visible, button.head:focus-visible, textarea:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; }
.btns button.on.works { background: var(--ok); border-color: var(--ok); color: #0d1f0d; }
.btns button.on.broken { background: var(--bad); border-color: var(--bad); color: #2a0b08; }
.btns button.on.skip { background: var(--skip); border-color: var(--skip); color: #111; }
.note { grid-column: 1 / -1; }
.note textarea { width: 100%; min-height: 36px; resize: vertical; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
.note textarea::placeholder { color: #6f6f6f; }
.empty { padding: 14px; color: var(--fg-dim); }
@media (max-width: 560px) {
  .item { grid-template-columns: 1fr; }
  .filters { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .item { transition: box-shadow .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ROBLEND Test Run</h1><span class="ver">plugin 0.24.6</span></div>
    <p class="lede">Go down the list in Studio. Mark each one Works, Broken or Skip, and say what went wrong in the note when something breaks. Claude reads these results and fixes what failed.</p>
    <div class="bar" aria-hidden="true"><span class="ok" id="barOk"></span><span class="bad" id="barBad"></span><span class="skip" id="barSkip"></span></div>
    <div class="stats">
      <span><span class="dot" style="background:var(--ok)"></span><b id="nOk">0</b> works</span>
      <span><span class="dot" style="background:var(--bad)"></span><b id="nBad">0</b> broken</span>
      <span><span class="dot" style="background:var(--skip)"></span><b id="nSkip">0</b> skipped</span>
      <span><b id="nLeft">0</b> to go</span>
      <span class="save-state" id="saveState">Loading saved results…</span>
      <div class="filters" role="group" aria-label="Show">
        <button class="chip" id="fAll" aria-pressed="true">All</button>
        <button class="chip" id="fTodo" aria-pressed="false">Not tested</button>
        <button class="chip" id="fBad" aria-pressed="false">Broken</button>
      </div>
    </div>
  </header>
  <main id="list"></main>
</div>

  ["collision", "Collision panel", "Properties > Object > Collision: Box / Hull / Default / Precise, Render detail, Can Collide, Anchored, Cast Shadow.", "Each changes the part (check in Studio's Properties); stays after editing the mesh."],
  ["save", "Save to Roblox", "File > Save Mesh (needs the CreateAssetAsync beta).", "Status says Saved with an rbxassetid; the part keeps its look."],
  ["autosave", "Auto save", "Edit something and press [Tab] to leave Edit Mode.", "It saves by itself."],
  ["reopen", "After a restart", "Save the place, close Studio, open it again.", "The meshes are all still there and look right."],
  ["bake", "Bake to Parts / Export .obj", "Mesh menu > Bake to Parts; Export .obj.", "A copy made of normal parts / an OBJ script to copy."],
  ["undo", "Undo / redo", "[Ctrl+Z] and [Ctrl+Y] after edits, in both modes.", "Steps back and forward; the mesh reloads correctly."],
  ["speed", "Speed on a big mesh", "Subdivide a sphere a few times, then G-drag a big selection.", "Moves smoothly (no rebuild stutter)."],
 ]},
];

const ALL = [];
TESTS.forEach(g => g.items.forEach(it => ALL.push(it[0])));
const results = {};        // id -> {status, note}
let filter = "all";
let db = null;
let saveMsg = document.getElementById("saveState");

function keys(text) {
  const frag = document.createDocumentFragment();
  const parts = text.split(/(\[[^\]]+\])/g);
  for (const p of parts) {
    if (/^\[[^\]]+\]$/.test(p)) { const k = document.createElement("kbd"); k.textContent = p.slice(1, -1); frag.appendChild(k); }
    else if (p) frag.appendChild(document.createTextNode(p));
  }
  return frag;
}

const collapsed = {};
try { Object.assign(collapsed, JSON.parse(localStorage.getItem("rbt-collapsed") || "{}")); } catch (e) {}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  let shown = 0;
  TESTS.forEach((g, gi) => {
    const sec = document.createElement("section"); sec.className = "group";
    const head = document.createElement("button"); head.className = "head"; head.setAttribute("aria-expanded", collapsed[gi] ? "false" : "true");
    const tri = document.createElement("span"); tri.className = "tri"; tri.textContent = collapsed[gi] ? "▸" : "▾";
    const h2 = document.createElement("h2"); h2.textContent = g.g;
    const cnt = document.createElement("span"); cnt.className = "count";
    const done = g.items.filter(it => results[it[0]]).length;
    const bad = g.items.filter(it => results[it[0]] && results[it[0]].status === "broken").length;
    cnt.textContent = done + " / " + g.items.length;
    if (bad) { const b = document.createElement("span"); b.className = "b"; b.textContent = "  · " + bad + " broken"; cnt.appendChild(b); }
    head.append(tri, h2, cnt);
    head.addEventListener("click", () => { collapsed[gi] = !collapsed[gi]; try { localStorage.setItem("rbt-collapsed", JSON.stringify(collapsed)); } catch (e) {} render(); });
    sec.appendChild(head);
    if (!collapsed[gi]) {
      const box = document.createElement("div"); box.className = "items";
      g.items.forEach(([id, name, how, expect]) => {
        const r = results[id];
        if (filter === "todo" && r) return;
        if (filter === "bad" && !(r && r.status === "broken")) return;
        shown++;
        const row = document.createElement("div"); row.className = "item" + (r ? " st-" + r.status : "");
        const txt = document.createElement("div"); txt.className = "txt";
        const n = document.createElement("div"); n.className = "name"; n.textContent = name;
        const h = document.createElement("div"); h.className = "how"; h.appendChild(keys(how));
        const e = document.createElement("div"); e.className = "expect"; e.appendChild(keys(expect));
        txt.append(n, h, e);
        const btns = document.createElement("div"); btns.className = "btns";
        [["works", "Works"], ["broken", "Broken"], ["skip", "Skip"]].forEach(([st, label]) => {
          const b = document.createElement("button"); b.textContent = label; b.className = st + (r && r.status === st ? " on" : "");
          b.setAttribute("aria-pressed", r && r.status === st ? "true" : "false");
          b.addEventListener("click", () => setStatus(id, r && r.status === st ? null : st));
          btns.appendChild(b);
        });
        row.append(txt, btns);
        if (r && r.status !== "works" || (r && r.note)) {
          const nb = document.createElement("div"); nb.className = "note";
          const ta = document.createElement("textarea"); ta.id = "note-" + id;
          ta.placeholder = r.status === "broken" ? "What happened? (what you did, what you saw, any message)" : "Note (optional)";
          ta.value = (r && r.note) || "";
          ta.addEventListener("change", () => setNote(id, ta.value));
          nb.appendChild(ta); row.appendChild(nb);
        }
        box.appendChild(row);
      });
      if (!box.children.length) { const em = document.createElement("div"); em.className = "empty"; em.textContent = filter === "bad" ? "Nothing broken here." : "All tested here."; box.appendChild(em); }
      sec.appendChild(box);
    }
    list.appendChild(sec);
  });
  totals();
}

function totals() {
  let ok = 0, bad = 0, skip = 0;
  for (const id of ALL) { const r = results[id]; if (!r) continue; if (r.status === "works") ok++; else if (r.status === "broken") bad++; else skip++; }
  const n = ALL.length;
  document.getElementById("nOk").textContent = ok;
  document.getElementById("nBad").textContent = bad;
  document.getElementById("nSkip").textContent = skip;
  document.getElementById("nLeft").textContent = n - ok - bad - skip;
  document.getElementById("barOk").style.width = (ok / n * 100) + "%";
  document.getElementById("barBad").style.width = (bad / n * 100) + "%";
  document.getElementById("barSkip").style.width = (skip / n * 100) + "%";
}

function cacheLocal() { try { localStorage.setItem("rbt-results", JSON.stringify(results)); } catch (e) {} }

async function write(id) {
  cacheLocal();
  if (!db) return;
  const r = results[id];
  try {
    saveMsg.textContent = "Saving…";
    if (r) await db.doc("results/" + id).set({ status: r.status, note: r.note || "", updated: new Date().toISOString() });
    else await db.doc("results/" + id).delete();
    saveMsg.textContent = "Saved. Claude can read these.";
  } catch (e) {
    saveMsg.textContent = "Couldn't save to the shared results (" + (e && e.code || "error") + "); kept in this browser only.";
  }
}
function setStatus(id, st) {
  if (st) results[id] = Object.assign({}, results[id] || {}, { status: st });
  else delete results[id];
  render();
  write(id);
  if (st === "broken") { const ta = document.getElementById("note-" + id); if (ta) ta.focus(); }
}
function setNote(id, note) {
  if (!results[id]) results[id] = { status: "broken" };
  results[id].note = note;
  write(id);
}

for (const [btnId, f] of [["fAll", "all"], ["fTodo", "todo"], ["fBad", "bad"]]) {
  document.getElementById(btnId).addEventListener("click", () => {
    filter = f;
    for (const b of ["fAll", "fTodo", "fBad"]) document.getElementById(b).setAttribute("aria-pressed", b === btnId ? "true" : "false");
    render();
  });
}

// start with what this browser remembers, then the shared results
try { Object.assign(results, JSON.parse(localStorage.getItem("rbt-results") || "{}")); } catch (e) {}
render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { saveMsg.textContent = "Results are kept in this browser only."; return; }
  db.collection("results").onSnapshot(snap => {
    for (const k of Object.keys(results)) delete results[k];
    snap.docs.forEach(d => { const v = d.data(); if (v && v.status) results[d.id] = { status: v.status, note: v.note || "" }; });
    cacheLocal();
    saveMsg.textContent = "Saved results loaded. Claude can read these.";
    const active = document.activeElement && document.activeElement.tagName === "TEXTAREA" ? document.activeElement.id : null;
    if (!active) render(); else totals();
  }, () => { saveMsg.textContent = "Couldn't reach the shared results; kept in this browser only."; });
})();
</script>
